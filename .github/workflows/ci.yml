# Build + test trên Windows; đóng gói bản chạy được (không kèm mô hình).
# Push tag v* (ví dụ v0.1.0) -> tạo GitHub Release đính kèm file zip.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # tạo release khi push tag

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Thư viện vcpkg đã build (MuPDF, HarfBuzz, curl…) — lần đầu ~20 phút, các lần sau dùng cache.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Baseline cố định trong vcpkg.json (builtin-baseline) cần lịch sử git của vcpkg.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build and test (release)
        shell: pwsh
        run: .\tools\build.ps1 -Preset release -Test

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: .\tools\package.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HUSTpdf-win64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" "$zip" --title "HUSTpdf ${{ github.ref_name }}" --generate-notes `
            --notes "Bản Windows 64-bit, chạy không cần cài đặt. Mô hình dịch không đi kèm: lần chạy đầu app hướng dẫn tải HY-MT1.5-1.8B (1,13 GB) từ Hugging Face hoặc chọn file GGUF có sẵn."
